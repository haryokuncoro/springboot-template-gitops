apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: springboot-app

spec:
  ingressClassName: nginx

  rules:
    - host: springboot.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: springboot-app

                port:
                  number: 80